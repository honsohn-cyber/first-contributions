name: Deploy essential-oils to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "essential-oils/**"
      - ".github/workflows/deploy-essential-oils-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let in-flight deployments finish
# instead of cancelling them.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload essential-oils/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: essential-oils

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
