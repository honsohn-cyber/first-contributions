name: Deploy essential-oils to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "essential-oils/**"
      - ".github/workflows/deploy-essential-oils-pages.yml"
  workflow_dispatch:

# Only one Pages deployment at a time; let in-flight deployments finish
# instead of cancelling them.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pushes essential-oils/ to the gh-pages branch directly, bypassing
      # the GitHub Pages "environment" deployment-protection pipeline
      # (which can get stuck waiting on some accounts/repos). Requires
      # Settings → Pages → Source = "Deploy from a branch", branch
      # "gh-pages", folder "/ (root)".
      - name: Publish essential-oils/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: essential-oils
          publish_branch: gh-pages
